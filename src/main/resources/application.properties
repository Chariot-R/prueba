spring.application.name=tisolutions-cotizaciones
server.port=8080

# --- SQL Server (ejecutar antes database/01_schema.sql y 02_datos_prueba.sql) ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=tisolutions;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:char}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo define el script SQL (con sus CHECK y FK); Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# No exponer detalles internos en errores
server.error.include-message=never
server.error.include-stacktrace=never

# --- Reglas del negocio ---
# Tasa de IGV vigente (se copia a cada cotización nueva y queda congelada en ella)
app.igv.tasa=0.18
# Margen de ganancia por defecto propuesto en una cotización nueva (%)
app.margen.defecto=30

# --- Seguridad / acceso ---
# Bloqueo temporal tras varios intentos fallidos seguidos
app.seguridad.max-intentos=5
app.seguridad.minutos-bloqueo=15
# Primer administrador: se toma de variables de entorno (NUNCA escribir la contraseña aquí)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Sesión: se cierra sola tras 30 min sin uso; la cookie no se puede leer desde JavaScript
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
# En producción (con HTTPS) definir la variable SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
