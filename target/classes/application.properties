spring.application.name=tisolutions-cotizaciones
server.port=8080

# --- SQL Server (ejecutar antes database/01_schema.sql y 02_datos_prueba.sql) ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=tisolutions;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:char}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo define el script SQL (con sus CHECK y FK); Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# No exponer detalles internos en errores
server.error.include-message=never
server.error.include-stacktrace=never

# --- Reglas del negocio ---
# Tasa de IGV vigente (se copia a cada cotización nueva y queda congelada en ella)
app.igv.tasa=0.18
# Margen de ganancia por defecto propuesto en una cotización nueva (%)
app.margen.defecto=30
# Usuario que registra las cotizaciones mientras no exista el módulo de login (Spring Security)
app.usuario-actual-id=2
